name: makroteknik

services:
  client-builder:
    image: node:20-alpine
    container_name: makroteknik-client-builder
    working_dir: /client
    volumes:
      # React source (already on server)
      - ../client:/client

      # Output directly into Plesk httpdocs
      - ./:/output
    environment:
      - NODE_ENV=production
    command: >
      sh -c "
        npm install &&
        npm run build &&
        rm -rf /output/* &&
        if [ -d build ]; then cp -r build/* /output/; fi &&
        if [ -d dist ]; then cp -r dist/* /output/; fi
      "
  api:
    build:
      context: ./services/api
    container_name: makroteknik-api
    ports:
      - "127.0.0.1:8080:8080"
    env_file:
      - ./services/api/.env
    networks:
      - makroteknik-net
    restart: unless-stopped

networks:
  makroteknik-net:
    driver: bridge
